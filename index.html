<!DOCTYPE html>
<html lang="en" style="--h: var(--Realism); color-scheme: light;" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ansh Garg</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&amp;display=swap">
<style>
:root{--bg:#0D1017;--sf:#161A23;--sf2:#1E2330;--ink:#E8EAF0;--mute:#8A93A5;--line:#262C3A;--a:#E0566B;--h:#E0566B;--Philosophy:#8E6BC9;--Economics:#2FA58C;--Investing:#D9A03F;--History:#D2663F;--Politics:#5B8FD6;--Mind:#E8743A;--Realism:#4FA3B8;--Paper:#7C86D9;--Other:#7E8B9B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#EEF0F4;--sf:#FFFFFF;--sf2:#E3E6EC;--ink:#12151C;--mute:#5E6675;--line:#CDD2DB;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 'Manrope','Helvetica Neue',Arial,sans-serif;overflow-x:hidden}
.amb{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.amb i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 38s ease-in-out infinite alternate;background:var(--h);transition:background 1.2s}
.amb i:nth-child(2){right:-20vmax;bottom:-20vmax;background:var(--Politics);animation-duration:52s;opacity:.18}
.amb i:nth-child(1){left:-25vmax;top:-25vmax}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.amb i,.pg i{animation:none!important}html{scroll-behavior:auto}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 18px 190px}
.top{position:sticky;top:0;z-index:6;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pill{flex:0 0 auto;border:0;background:var(--sf2);color:var(--ink);font:700 14px 'Manrope',sans-serif;padding:8px 16px;border-radius:99px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hero{margin:6px -18px 8px;padding:34px 18px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--h) 45%,transparent),transparent);transition:background 1s}
.hero h1{font:800 clamp(46px,13vw,104px)/.95 'Manrope',sans-serif;letter-spacing:-.04em;margin:0 0 10px}
.hero p{margin:0 0 14px;color:var(--ink);opacity:.8;font-size:18px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 14px 'Manrope',sans-serif;border:0;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;text-decoration:none;cursor:pointer;display:inline-block}
.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.g{background:var(--a);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 12px}
.sh h2{font:800 24px 'Manrope',sans-serif;margin:0;letter-spacing:-.02em}
.sh button{background:none;border:0;color:var(--mute);font:700 14px 'Manrope',sans-serif;cursor:pointer}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tile{flex:0 0 138px;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;position:relative}
.art{aspect-ratio:1;border-radius:8px;background-size:cover;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font:800 15px/1.15 'Manrope',sans-serif;background-color:var(--c);box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .2s}
.tile:hover .art,.tile:focus-visible .art{transform:translateY(-5px) scale(1.02)}
.art.bk{aspect-ratio:2/3;border-radius:3px 8px 8px 3px;background-image:linear-gradient(90deg,rgba(0,0,0,.3) 0 5px,transparent 5px),linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.25))}
.art small{font:600 11px 'Manrope',sans-serif;opacity:.85;margin-top:4px;display:block}
.tile h3{font:700 14px/1.25 'Manrope',sans-serif;margin:8px 0 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile p{font:500 13px 'Manrope',sans-serif;color:var(--mute);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px}
.grid .tile{flex:none}
input[type=search],input[type=text]{width:100%;font:500 16px 'Manrope',sans-serif;padding:11px 16px;border:0;border-radius:99px;background:var(--sf2);color:var(--ink);margin:0 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:0;background:var(--sf2);color:var(--ink);font:700 13px 'Manrope',sans-serif;padding:6px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.li{display:flex;gap:14px;align-items:center;width:100%;padding:10px;border:0;background:none;color:inherit;text-align:left;border-radius:10px;cursor:pointer;position:relative}
.li:hover,.li.hot{background:var(--sf)}
.li .th{width:50px;height:50px;border-radius:6px;flex:0 0 auto;background-size:cover;background-color:var(--c);display:grid;place-items:center;color:#fff;font:800 13px 'Manrope',sans-serif}
.li h3{margin:0;font:700 16px 'Manrope',sans-serif}.li p{margin:0;font-size:14px;color:var(--mute)}
.li .go{margin-left:auto;font:700 13px 'Manrope',sans-serif;color:var(--a);text-decoration:none;padding:6px 10px}
.nt{font:italic 400 16px/1.5 'Source Serif 4',serif;color:var(--ink);opacity:.85;margin:4px 0 0}
.card{background:var(--sf);border-radius:14px;padding:18px 20px;margin:0 0 14px;position:relative}
.card h3{margin:0 0 4px;font:800 20px 'Manrope',sans-serif}.card .st{font:700 12px 'Manrope',sans-serif;color:var(--a);margin:0 0 8px}
.card p{margin:0;font:400 16.5px/1.6 'Source Serif 4',serif}
.mute{color:var(--mute)}.sm{font-size:14px}
input[type=range]{width:100%;accent-color:var(--a)}
.crowd{height:6px;background:var(--line);border-radius:6px;position:relative;margin:12px 0 6px}.crowd i{position:absolute;top:-4px;width:5px;height:14px;background:var(--a);border-radius:3px}
.rw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.curve{width:100%;height:auto}.curve text{font:600 12px 'Manrope',sans-serif;fill:var(--mute)}.curve path{fill:none;stroke-width:2.8}.curve .g{stroke:var(--line);stroke-dasharray:4 4}
.net{width:100%;height:auto;background:var(--sf);border-radius:14px}
.net text{font:600 10.5px 'Manrope',sans-serif;fill:var(--mute);text-anchor:middle;pointer-events:none}
.net line{stroke:var(--line);stroke-width:1.4}.net line.on{stroke:var(--a);stroke-width:2.4}
.net circle{fill:var(--sf2);stroke:var(--Realism);stroke-width:2;cursor:pointer;transition:fill .3s,stroke .3s}
.net circle.hit{fill:var(--a);stroke:var(--a)}.net circle.src{fill:var(--Investing);stroke:var(--Investing)}
.net .ph{fill:none;stroke:none}
.meter{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:var(--a)}
dialog{border:0;border-radius:18px;background:var(--sf);color:var(--ink);padding:0;max-width:420px;width:calc(100% - 36px)}
dialog::backdrop{background:rgba(5,7,11,.7)}
dialog .in{padding:0 0 22px}dialog .cover{height:150px;background:linear-gradient(160deg,var(--c),var(--sf));display:flex;align-items:flex-end;padding:16px}
dialog .cover b{font:800 12px 'Manrope',sans-serif;color:#fff;opacity:.9}
dialog .bd{padding:16px 22px 0}dialog h3{font:800 26px/1.1 'Manrope',sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.pl{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:8;max-width:964px;margin:0 auto;background:color-mix(in srgb,var(--c,var(--sf2)) 40%,var(--sf));border-radius:14px;padding:10px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:background .6s}
.pl .r{display:flex;align-items:center;gap:12px}
.pl .th{width:46px;height:46px;border-radius:6px;background-size:cover;background-color:var(--c);flex:0 0 auto}
.pl .tx{flex:1;min-width:0}.pl b{display:block;font:800 14px 'Manrope',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl button{border:0;background:none;color:var(--ink);font:800 18px sans-serif;width:38px;height:38px;border-radius:50%;cursor:pointer}
.pl .pp{background:var(--ink);color:var(--bg);font-size:14px}
.pg{height:3px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ink);animation:pg 45s linear infinite}.pg.p i{animation-play-state:paused}
@keyframes pg{from{width:0}to{width:100%}}
.edit [data-p]{outline:1px dashed var(--a);outline-offset:2px}
.x{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;display:none;cursor:pointer;z-index:2}.edit .x{display:block}
.eb{position:fixed;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:9;display:none;gap:8px}
footer{margin-top:40px;color:var(--mute);font-size:14px}footer a{color:var(--a)}
.hi{margin:0 0 2px;font-weight:700;color:var(--mute)}
.rot{font:800 clamp(22px,6vw,34px)/1.2 'Manrope',sans-serif;margin:8px 0 6px}
.rot b{display:inline-block;animation:pop .5s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cur{display:inline-block;width:3px;height:.95em;background:var(--ink);margin-left:5px;vertical-align:-.1em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stats{display:flex;gap:28px;margin:16px 0 16px}.stats b{display:block;font:800 30px 'Manrope',sans-serif;line-height:1}.stats span{font-size:13px;color:var(--mute)}
.shelf{display:flex;align-items:flex-end;gap:4px;overflow-x:auto;padding:30px 8px 0;border-bottom:10px solid var(--sf2);margin-top:22px;scrollbar-width:none}
.spn{flex:0 0 auto;border:0;border-radius:3px 3px 0 0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:10px 0;box-shadow:inset 3px 0 0 rgba(255,255,255,.2),inset -3px 0 0 rgba(0,0,0,.3);background-color:var(--c);background-size:cover;transition:transform .2s;transform-origin:bottom}
.spn span{writing-mode:vertical-rl;font:800 12px/1 'Manrope',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.6);max-height:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spn:hover,.spn:focus-visible{transform:translateY(-14px)}
.spn.lean{transform:rotate(7deg);margin:0 12px}
.mood{margin:28px 0 0}.mood h2{font:800 22px 'Manrope',sans-serif;margin:0 0 2px}.mres{margin-top:14px}.mres .row{align-items:flex-start}
@media(prefers-reduced-motion:reduce){.cur,.rot b{animation:none}.spn{transition:none}}
.brw{background:var(--sf);border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.bt{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--sf2)}.bt i{width:9px;height:9px;border-radius:50%;background:var(--mute);opacity:.5}
.bt span{margin-left:10px;font:700 12px 'Manrope',sans-serif;color:var(--mute);background:var(--bg);padding:3px 14px;border-radius:99px}
.bb{padding:16px}.brw .net{background:none;border-radius:0}
.net circle.fl{fill:var(--Realism);stroke:none;pointer-events:none;cursor:default}
</style>
</head>

if(V==='anvesin')h+=anv();
if(editing)h+='<div class="card" style="margin-top:24px"><h3>Links</h3><p class="sm">Spotify: '+E('spotify',S.spotify,'span')+'</p><p class="sm">Substack: '+E('substack',S.substack,'span')+'</p><p class="sm">Email: '+E('email',S.email,'span')+'</p></div>';
h+='<footer>'+esc(S.name)+(isOwner&&!editing?' · <a href="#" id="edit">Edit this site</a>':'')+'</footer>';
app.className=editing?'wrap edit':'wrap';app.innerHTML=h;eb.style.display=editing?'flex':'none';

var RW=[['power','var(--Realism)'],['money','var(--Investing)'],['ideas','var(--Philosophy)'],['history','var(--History)'],['people','var(--Mind)'],['markets','var(--Economics)']];

el.innerHTML='<div class="row">'+tile('books',b)+tile('papers',p)+tile('songs',s)+'</div>';setNow('books',b,false);

return '<div class="brw"><div class="bt"><i></i><i></i><i></i><span>anvesin.in</span></div><div class="bb"><p class="sm mute" style="margin:0 0 10px">A prototype. Pick a disruption and watch it travel through a supply chain. Illustrative data, not live.</p><div class="chips">'+[['Port strike',4],['Fuel spike',3],['Chip shortage',0],['Bad monsoon',2]].map(function(s){return '<button class="chip" data-sc="'+s[1]+'" aria-pressed="false" style="--c:var(--a)">'+s[0]+'</button>'}).join('')+'</div><svg class="net" viewBox="0 0 500 290" role="img" aria-label="Supply chain network prototype">'+NE.map(function(e){return '<line x1="'+NN[e[0]][1]+'" y1="'+NN[e[0]][2]+'" x2="'+NN[e[1]][1]+'" y2="'+NN[e[1]][2]+'"/>'}).join('')+fl+NN.map(function(n,i){return '<circle data-n="'+i+'" cx="'+n[1]+'" cy="'+n[2]+'" r="11" tabindex="0" role="button" aria-label="Take '+esc(n[0])+' offline"/><text x="'+n[1]+'" y="'+(n[2]+26)+'">'+esc(n[0])+'</text>'}).join('')+'</svg><div class="rw" style="margin-top:12px;align-items:flex-start"><div><span class="sm mute">Exposure</span><b id="ex" style="display:block;font:800 34px/1 Manrope,sans-serif">0%</b></div><p id="nr" class="sm" style="margin:0;flex:1">Pick a disruption, or tap any node to take it offline.</p></div></div></div>'}

app.querySelectorAll('[data-sc]').forEach(function(b){b.onclick=function(){shock(+b.dataset.sc);app.querySelectorAll('[data-sc]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});

document.getElementById('add').onclick=function(){var w=(prompt('Add: book, paper, song, forecast or idea','book')||'').toLowerCase();if(!w)return;

else if(w.indexOf('p')===0)S.papers.unshift(['New paper','Authors',2024,'Economics','Why it matters.']);
else if(w.indexOf('s')===0)S.songs.unshift(['New song','Artist','','Why it is here.']);
else if(w.indexOf('f')===0||w.indexOf('be')===0)S.bets.push({id:'b'+Date.now(),q:'New forecast'});
else S.ideas.push({t:'New idea',s:'Working idea',d:'Say it in a few lines.'});render()};

c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='';c.querySelector('#dlg').innerHTML='';c.querySelector('#pl').innerHTML='';c.querySelector('#pl').setAttribute('hidden','');c.querySelector('#eb').removeAttribute('style');c.querySelector('#pl').removeAttribute('style');

})();
